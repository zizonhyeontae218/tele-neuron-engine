[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamath"
version = "0.1.1"
description = "DynaMath: cyclic learned laws over one persistent information state."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dynamath = "dynamath.korean:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dynamath*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
