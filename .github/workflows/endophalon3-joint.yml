name: Endophalon 3 joint AB training
on:
  push:
    branches: [experiment/endophalon3-continuation]
    paths: [.github/workflows/endophalon3-joint.yml]
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        run: [ab_binary_s1, ab_binary_s2, ab_onehot_s1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . numpy==2.3.5 pytest
      - run: python -m pytest -q
      - name: Train with validation-only selection
        run: |
          set -o pipefail
          mkdir -p docs/endophalon3_joint_runs/20261101/${{ matrix.run }}
          python -u scripts/train_endophalon3_joint.py --run ${{ matrix.run }} --workers 4 2>&1 | tee docs/endophalon3_joint_runs/20261101/${{ matrix.run }}/train.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-${{ matrix.run }}
          path: docs/endophalon3_joint_runs/20261101/${{ matrix.run }}/
          retention-days: 90
