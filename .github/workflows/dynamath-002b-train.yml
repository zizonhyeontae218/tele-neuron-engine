name: DynaMath 002b final training
on:
  push:
    branches:
      - feature/dynamath-002
    paths:
      - .github/workflows/dynamath-002b-train.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dynamath-002b-final
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out existing 002 branch
        uses: actions/checkout@v4
        with:
          ref: feature/dynamath-002
          fetch-depth: 1
      - name: Python CPU runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify existing 002 code and 002b runner
        run: |
          python -m py_compile scripts/train_dynamath_002b.py
          python -m pytest -q tests/test_dynamath_002.py
      - name: Continue 002a 18k models through 002b 72k (Model 1 and Model 3 Cross only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/dynamath/experiment-002b models/dynamath/002b
          python -u scripts/train_dynamath_002b.py 2>&1 | tee docs/dynamath/experiment-002b/workflow-run.log
      - name: Upload evidence even after training failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamath-002b-final-evidence
          path: |
            docs/dynamath/experiment-002b/
            models/dynamath/002b/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit training evidence to the original 002 branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dynamath/experiment-002b/ models/dynamath/002b/
          python scripts/filetree_index.py update
          git add FileTree.md FILETREE.hash.json
          python scripts/filetree_index.py lint
          if ! git diff --cached --quiet; then
            git commit -m "Complete DynaMath 002b final continuation and publish evidence"
            git push origin HEAD:feature/dynamath-002
          fi
