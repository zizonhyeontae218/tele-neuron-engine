name: Endophalon 3 independent A B 120 and cleanup
on:
  push:
    branches: [master]
    paths: [.github/workflows/endophalon3-independent.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: endophalon3-independent120
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  TRIAL_ROOT: docs/endophalon3_software_runs/20261102/independent120
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        level: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements.txt numpy==2.3.5
      - name: Refuse repeated completed runs
        run: test ! -f "$TRIAL_ROOT/${{ matrix.level }}/model.json"
      - name: Train one independent model for exactly 120 generations
        run: |
          set -o pipefail
          mkdir -p "$TRIAL_ROOT/${{ matrix.level }}"
          python -u scripts/train_endophalon3_independent.py --level '${{ matrix.level }}' --output-dir "$TRIAL_ROOT/${{ matrix.level }}" --workers 4 2>&1 | tee "$TRIAL_ROOT/${{ matrix.level }}/training.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endophalon3-independent-${{ matrix.level }}
          path: ${{ env.TRIAL_ROOT }}/${{ matrix.level }}/
          retention-days: 90
          if-no-files-found: warn
  audit-retire-publish:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements.txt numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          pattern: endophalon3-independent-*
          path: /tmp/endophalon3-independent
      - name: Restore both completed artifacts to their original paths
        run: |
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          for level in 'AB':
              source=Path('/tmp/endophalon3-independent')/('endophalon3-independent-'+level)
              target=Path(os.environ['TRIAL_ROOT'])/level
              assert (source/'model.json').is_file() and not target.exists()
              shutil.copytree(source,target)
          PY
      - name: Audit both models and retire obsolete 3 versions
        run: |
          set -o pipefail
          python -u scripts/finalize_endophalon3_independent.py "$TRIAL_ROOT" 2>&1 | tee "$TRIAL_ROOT/finalization.log"
      - name: Validate the final current tree
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$TRIAL_ROOT/tests.log"
          python scripts/smoke_models.py 2>&1 | tee "$TRIAL_ROOT/smoke.log"
          python scripts/verify_backup_consolidation.py 2>&1 | tee "$TRIAL_ROOT/backup_integrity.log"
          python - <<'PYCODE' | tee -a "$TRIAL_ROOT/backup_integrity.log"
          import json,subprocess
          from pathlib import Path
          evidence=json.loads(Path('docs/integration/backup-consolidation-2026-11-01.json').read_text())
          for name,expected in evidence['required_master_files'].items():
              actual=subprocess.check_output(['git','hash-object','--',name],text=True).strip()
              assert actual==expected['git_blob'],name
          print('PASS: all 166 protected files also match the actual release worktree')
          PYCODE
          python scripts/filetree_index.py update
          python scripts/filetree_index.py lint
      - name: Preserve reviewable final tree even if publication is refused
        if: always()
        run: git diff --binary > /tmp/endophalon3-independent-final-tree.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endophalon3-independent-release
          path: |
            docs/endophalon3_software_runs/20261102/independent120/
            models/endophalon3_software/
            docs/endophalon3_development.md
            /tmp/endophalon3-independent-final-tree.patch
          retention-days: 90
      - name: Atomically fast-forward both unchanged canonical branches
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,subprocess,tempfile
          from pathlib import Path
          source=os.environ['SOURCE_SHA']
          refs=dict(line.split()[::-1] for line in subprocess.check_output(['git','ls-remote','origin','refs/heads/master','refs/heads/endophalon3'],text=True).splitlines())
          expected={'refs/heads/master':source,'refs/heads/endophalon3':source}
          if refs!=expected:raise SystemExit('Concurrent branch changes; reviewed outputs preserved, normal integration required')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','Complete independent A/B 120-generation training and retire obsolete 3 versions'],check=True)
          with tempfile.TemporaryDirectory() as tmp:
              hook=Path(tmp)/'pre-push'
              hook.write_text('#!/usr/bin/env python3\nimport sys\nexpected='+repr(expected)+'\nseen=set()\nfor line in sys.stdin:\n a,b,c,d=line.split()\n if expected.get(c)!=d or a=="(delete)":sys.exit("Unexpected or changed ref: "+c)\n seen.add(c)\nif seen!=set(expected):sys.exit("Incomplete transaction")\n')
              hook.chmod(0o755)
              subprocess.run(['git','-c','core.hooksPath='+tmp,'push','--atomic','origin','HEAD:refs/heads/master','HEAD:refs/heads/endophalon3'],check=True)
          final=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          refs=dict(line.split()[::-1] for line in subprocess.check_output(['git','ls-remote','origin','refs/heads/master','refs/heads/endophalon3'],text=True).splitlines())
          assert refs=={ref:final for ref in expected}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Both 120-generation independent models audited; old 3 versions retired; master/endophalon3 match '+final+'\n')
          PY
