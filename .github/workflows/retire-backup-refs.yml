name: Retire consolidated backup refs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/retire-backup-refs.yml'
      - 'scripts/retire_backup_refs.py'
      - 'docs/integration/backup-consolidation-2026-11-01.json'

permissions:
  contents: read

concurrency:
  group: retire-backup-refs-20261101
  cancel-in-progress: false

jobs:
  retire:
    if: >-
      github.repository == 'zizonhyeontae218/tele-neuron-engine' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[retire-backups-20261101]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original content and merged history
        run: python scripts/verify_backup_consolidation.py
      - name: Inspect exact backup allowlist and remote heads
        run: python scripts/retire_backup_refs.py
      - name: Preserve tags and retire only audited backup refs
        run: python scripts/retire_backup_refs.py --apply
      - name: Verify legacy archive preview remains valid
        run: python scripts/archive_endophalon.py
