name: DynaMath 002a intensive continuation
on:
  push:
    branches:
      - feature/dynamath-002
    paths:
      - .github/workflows/dynamath-002a-train.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dynamath-002a-continuation
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out EXISTING 002 branch
        uses: actions/checkout@v4
        with:
          ref: feature/dynamath-002
          fetch-depth: 1
      - name: Python CPU runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify runner and existing 002 invariants
        run: |
          python -m py_compile scripts/train_dynamath_002a.py
          python -m pytest -q tests/test_dynamath_002.py
      - name: Train 002a from original 002 checkpoints
        run: |
          mkdir -p docs/dynamath/experiment-002a models/dynamath/002a
          python -u scripts/train_dynamath_002a.py 2>&1 | tee docs/dynamath/experiment-002a/workflow-run.log
        shell: bash
      - name: Store reproducible outputs even if commit is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamath-002a-training-evidence
          path: |
            docs/dynamath/experiment-002a/
            models/dynamath/002a/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit resulting checkpoints and report to SAME branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dynamath/experiment-002a/ models/dynamath/002a/
          python scripts/filetree_index.py update
          git add FileTree.md FILETREE.hash.json
          python scripts/filetree_index.py lint
          if ! git diff --cached --quiet; then
            git commit -m "Complete DynaMath 002a continued training and publish evidence"
            git push origin HEAD:feature/dynamath-002
          fi
